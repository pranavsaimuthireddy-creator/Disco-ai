
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>D.I.S.C.O AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>D.I.S.C.O</h1>
        <p>MOBILE AI SYSTEM</p>
    </header>


    <!-- AI CORE -->
    <div class="core">

        <div class="ring r1"></div>
        <div class="ring r2"></div>

        <div class="center"></div>

    </div>

    <p class="core-text">
        ● CORE ACTIVE
    </p>


    <!-- SYSTEM STATUS -->
    <section class="status">

        <h2>SYSTEM STATUS</h2>

        <div class="row">
            <span>AI CORE</span>
            <b class="on">● ONLINE</b>
        </div>

        <div class="row">
            <span>NETWORK</span>
            <b class="on">● ONLINE</b>
        </div>

        <div class="row">
            <span>VOICE</span>
            <b class="on">● READY</b>
        </div>

        <div class="row">
            <span>MEMORY</span>
            <b class="off">● LOCKED</b>
        </div>

    </section>


    <!-- CHAT -->
    <section class="chat" id="chat">

        <div class="msg ai">
            D.I.S.C.O: Systems online. How may I assist you, Boss?
        </div>

    </section>


    <!-- INPUT -->
    <div class="input-area">

        <input
            id="msg"
            type="text"
            placeholder="Ask D.I.S.C.O..."
            autocomplete="off"
        >

        <button id="mic" type="button">
            🎙️
        </button>

        <button id="send" type="button">
            SEND
        </button>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
