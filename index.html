<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D.I.S.C.O - MOBILE EDITION</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="scanlines"></div>
    <div class="stars"></div>

    <!-- HEADER -->
    <header class="top-header">

        <button class="menu-btn" type="button">☰</button>

        <div class="header-logo">
            D.I.S.C.O
        </div>

        <div class="edition">
            ▯ &nbsp; MOBILE EDITION
        </div>

    </header>


    <main>

        <!-- HERO -->
        <section class="hero">

            <div class="hero-content">

                <div class="main-logo">
                    D.I.S.C.O
                </div>

                <div class="mobile-edition">
                    MOBILE EDITION
                </div>

                <div class="core-active">
                    <span>⌜</span>
                    CORE ACTIVE
                    <span>⌟</span>
                </div>

            </div>


            <!-- CORE -->
            <div class="core-area">

                <div class="core-ring ring1"></div>
                <div class="core-ring ring2"></div>
                <div class="core-ring ring3"></div>

                <div class="core-glow"></div>

                <img
                    id="coreImage"
                    src="./core.png"
                    alt="D.I.S.C.O Core"
                >

            </div>

        </section>


        <!-- SYSTEM STATUS -->
        <section class="system-status">

            <div class="status-heading">
                <span class="heading-icon">▣</span>
                SYSTEM STATUS
            </div>


            <div class="status-row">

                <div class="status-label">
                    <span class="status-icon cyan">▣</span>
                    AI CORE
                </div>

                <div class="status-online">
                    <span class="green-dot"></span>
                    ONLINE
                </div>

            </div>


            <div class="status-row">

                <div class="status-label">
                    <span class="status-icon cyan">⌁</span>
                    NETWORK
                </div>

                <div
                    class="status-online"
                    id="networkStatus"
                >
                    <span class="green-dot"></span>
                    ONLINE
                </div>

            </div>


            <div class="status-row">

                <div class="status-label">
                    <span class="status-icon red">♩</span>
                    VOICE
                </div>

                <div
                    class="status-locked"
                    id="voiceStatus"
                >
                    <span>▣</span>
                    LOCKED
                </div>

            </div>


            <div class="status-row">

                <div class="status-label">
                    <span class="status-icon red">▣</span>
                    MEMORY
                </div>

                <div
                    class="status-locked"
                    id="memoryStatus"
                >
                    <span>▣</span>
                    LOCKED
                </div>

            </div>


            <div class="status-row">

                <div class="status-label">
                    <span class="status-icon cyan">♙</span>
                    YOU
                </div>

                <div
                    class="you-status"
                    id="userStatus"
                >
                    Hi
                </div>

            </div>

        </section>


        <!-- CHAT -->
        <section class="chat-panel">

            <div
                id="chat"
                class="chat-box"
            >

                <div class="message ai-message">

                    <strong>D.I.S.C.O:</strong>

                    <span>
                        Systems online. How may I assist you, Boss?
                    </span>

                </div>

            </div>

        </section>


        <!-- COMMAND -->
        <section class="command-area">

            <div class="input-box">

                <input
                    id="msg"
                    type="text"
                    placeholder="Ask D.I.S.C.O..."
                    autocomplete="off"
                >

                <button
                    id="mic"
                    type="button"
                    title="Voice input"
                >
                    🎙
                </button>

            </div>


            <button
                id="send"
                type="button"
                class="send-button"
            >
                SEND
            </button>

        </section>


        <!-- EXTRA BUTTONS -->
        <section class="extra-controls">

            <button
                id="clearBtn"
                type="button"
            >
                CLEAR MEMORY
            </button>

            <button
                id="keyBtn"
                type="button"
            >
                API KEY
            </button>

            <label class="vision-button">

                VISION

                <input
                    id="imgInput"
                    type="file"
                    accept="image/*"
                >

            </label>

        </section>


        <!-- FOOTER -->
        <footer>

            <div class="footer-bars">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="footer-dots">
                • • • • •
            </div>

            <div class="footer-title">
                D.I.S.C.O SYSTEMS v1.0
            </div>

            <div class="footer-dots">
                • • •
            </div>

        </footer>

    </main>


    <script src="./script.js"></script>

</body>
</html>
