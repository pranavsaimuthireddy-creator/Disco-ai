<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D.I.S.C.O AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="scanlines"></div>

    <!-- HEADER -->
    <header>

        <div class="top-bar">

            <span class="menu-icon">☰</span>

            <span class="system-online">
                ● SYSTEM ONLINE
            </span>

            <span class="bot-icon">◉</span>

        </div>

        <h1>D.I.S.C.O</h1>

        <p>MOBILE AI SYSTEM</p>

    </header>


    <!-- CORE -->
    <section class="core-section">

        <div class="core">

            <div class="core-ring ring-outer"></div>
            <div class="core-ring ring-middle"></div>
            <div class="core-ring ring-inner"></div>

            <div class="core-lines"></div>

            <div class="core-centre">

                <strong>D.I.S.C.O</strong>

                <span>CORE ACTIVE</span>

                <i></i>

            </div>

        </div>

    </section>


    <!-- SYSTEM STATUS -->
    <section class="panel status-panel">

        <div class="panel-title">
            ⚡ SYSTEM STATUS
        </div>

        <div class="status-grid">

            <div class="status-card">

                <div class="status-icon">▣</div>

                <h3>AI CORE</h3>

                <span class="status-online">
                    ● ONLINE
                </span>

            </div>


            <div class="status-card">

                <div class="status-icon">⌁</div>

                <h3>NETWORK</h3>

                <span class="status-online">
                    ● ONLINE
                </span>

            </div>


            <div class="status-card">

                <div class="status-icon">♬</div>

                <h3>VOICE</h3>

                <span class="status-online">
                    ● READY
                </span>

            </div>


            <div class="status-card">

                <div class="status-icon">🧠</div>

                <h3>MEMORY</h3>

                <span class="status-online">
                    ● ONLINE
                </span>

            </div>

        </div>

    </section>


    <!-- CHAT -->
    <section class="chat-panel">

        <div class="chat-terminal">

            <div class="terminal-dots">

                <span></span>
                <span></span>
                <span></span>

            </div>

            <div class="chat" id="chat">

                <div class="msg ai">
                    D.I.S.C.O: Systems online.
                    How may I assist you, Boss?
                </div>

            </div>

        </div>

    </section>


    <!-- INPUT -->
    <section class="input-section">

        <div class="input-area">

            <input
                id="msg"
                type="text"
                placeholder="Ask D.I.S.C.O..."
                autocomplete="off"
            >

            <div id="button-area">

                <button id="send">
                    SEND
                </button>

                <button id="mic">
                    🎙️
                </button>

                <button id="clear-btn">
                    🗑️
                </button>

                <button id="change-key">
                    🔑 KEY
                </button>

                <button id="img-btn">
                    🖼️
                </button>

                <input
                    type="file"
                    id="img-input"
                    accept="image/*"
                    style="display:none"
                >

            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        <span>‹‹</span>

        <strong>
            D.I.S.C.O: ALWAYS WITH YOU
        </strong>

        <span>››</span>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
