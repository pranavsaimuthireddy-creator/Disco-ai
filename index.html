<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D.I.S.C.O. Mobile AI Core</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="top">

        <div class="brand-area">
            <div class="brand">D.I.S.C.O</div>
            <div class="subtitle">MOBILE AI CORE</div>
        </div>

        <div class="system-online">
            <span class="online-dot"></span>
            SYSTEM ONLINE
        </div>

    </header>


    <!-- AI CORE -->
    <section class="core-area">

        <div class="hud-ring ring-1"></div>
        <div class="hud-ring ring-2"></div>
        <div class="hud-ring ring-3"></div>

        <div class="core-container">

            <div class="core-glow"></div>

            <img
                id="coreImage"
                src="core.png"
                alt="D.I.S.C.O. AI Core"
            >

        </div>

        <div id="stateText" class="state-text">
            ◈ READY
        </div>

    </section>


    <!-- STATUS PANELS -->
    <section class="status-grid">

        <div class="status-card">
            <span class="status-icon">◈</span>

            <div>
                <strong>MEMORY</strong>
                <small id="memoryStatus">ONLINE</small>
            </div>
        </div>


        <div class="status-card">
            <span class="status-icon">◉</span>

            <div>
                <strong>VOICE</strong>
                <small id="voiceStatus">READY</small>
            </div>
        </div>


        <div class="status-card">
            <span class="status-icon">◇</span>

            <div>
                <strong>VISION</strong>
                <small>READY</small>
            </div>
        </div>


        <div class="status-card">
            <span class="status-icon">⌁</span>

            <div>
                <strong>NETWORK</strong>
                <small id="networkStatus">ONLINE</small>
            </div>
        </div>


        <div class="status-card">
            <span class="status-icon">✦</span>

            <div>
                <strong>AI CORE</strong>
                <small>ACTIVE</small>
            </div>
        </div>


        <div class="status-card">
            <span class="status-icon">▣</span>

            <div>
                <strong>SYSTEM</strong>
                <small>SYSTEM READY</small>
            </div>
        </div>

    </section>


    <!-- COMMUNICATION -->
    <section class="communication">

        <div class="communication-header">
            <span>D.I.S.C.O</span>
            <span>/</span>
            <span>COMMUNICATION</span>
        </div>


        <div id="chat" class="chat">

            <div class="message ai-message">
                Systems online. How may I assist you, Boss?
            </div>

        </div>

    </section>


    <!-- INPUT -->
    <section class="controls">

        <div class="input-row">

            <input
                id="msg"
                type="text"
                placeholder="Talk to D.I.S.C.O..."
                autocomplete="off"
            >

            <button
                id="mic"
                class="mic-button"
                type="button"
            >
                🎤
            </button>

            <button
                id="send"
                class="send-button"
                type="button"
            >
                SEND
            </button>

        </div>


        <div class="button-row">

            <button
                id="clearBtn"
                type="button"
            >
                CLEAR MEMORY
            </button>


            <button
                id="keyBtn"
                type="button"
            >
                API KEY
            </button>


            <label class="vision-button">

                🖼️ VISION

                <input
                    id="imgInput"
                    type="file"
                    accept="image/*"
                    hidden
                >

            </label>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>
        D.I.S.C.O. MOBILE AI CORE
    </footer>

</div>


<!-- YOUR EXISTING JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
