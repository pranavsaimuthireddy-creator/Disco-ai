<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>D.I.S.C.O - MOBILE EDITION</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HUD BACKGROUND -->
    <div class="stars"></div>
    <div class="scanlines"></div>

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <button class="menu-btn" type="button">
            ☰
        </button>

        <div class="logo">
            D.I.S.C.O
        </div>

        <div class="edition">
            <span class="phone-icon">▯</span>
            MOBILE EDITION
        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main>

        <!-- HERO -->

        <section class="hero">

            <div class="hero-left">

                <div class="big-logo">
                    D.I.S.C.O
                </div>

                <div class="mobile-title">
                    MOBILE EDITION
                </div>

                <div class="core-active">
                    <span class="corner">⌜</span>
                    CORE ACTIVE
                    <span class="corner">⌟</span>
                </div>

            </div>


            <!-- CORE -->

            <div class="core-area">

                <div class="core-ring ring-one"></div>
                <div class="core-ring ring-two"></div>
                <div class="core-ring ring-three"></div>

                <div class="core-glow"></div>

                <img
                    id="coreImage"
                    src="core.png"
                    alt="D.I.S.C.O Core"
                >

            </div>

        </section>


        <!-- ================= SYSTEM STATUS ================= -->

        <section class="status-panel">

            <div class="panel-title">

                <span class="title-icon">▣</span>

                <span>SYSTEM STATUS</span>

            </div>


            <!-- AI CORE -->

            <div class="status-row">

                <div class="status-name">

                    <span class="status-icon">▣</span>

                    <span>AI CORE</span>

                </div>

                <div class="status-value online">
                    <span class="dot"></span>
                    ONLINE
                </div>

            </div>


            <!-- NETWORK -->

            <div class="status-row">

                <div class="status-name">

                    <span class="status-icon">⌁</span>

                    <span>NETWORK</span>

                </div>

                <div
                    class="status-value online"
                    id="networkStatus"
                >
                    <span class="dot"></span>
                    ONLINE
                </div>

            </div>


            <!-- VOICE -->

            <div class="status-row">

                <div class="status-name">

                    <span class="status-icon voice-icon">♩</span>

                    <span>VOICE</span>

                </div>

                <div
                    class="status-value locked"
                    id="voiceStatus"
                >
                    <span class="lock">▣</span>
                    LOCKED
                </div>

            </div>


            <!-- MEMORY -->

            <div class="status-row">

                <div class="status-name">

                    <span class="status-icon memory-icon">▣</span>

                    <span>MEMORY</span>

                </div>

                <div
                    class="status-value locked"
                    id="memoryStatus"
                >
                    <span class="lock">▣</span>
                    LOCKED
                </div>

            </div>


            <!-- YOU -->

            <div class="status-row">

                <div class="status-name">

                    <span class="status-icon user-icon">♙</span>

                    <span>YOU</span>

                </div>

                <div
                    class="status-value you-status"
                    id="userStatus"
                >
                    Hi
                </div>

            </div>

        </section>


        <!-- ================= CHAT ================= -->

        <section class="chat-panel">

            <div
                id="chat"
                class="chat-box"
            >

                <div class="message ai ai-message">

                    <strong>D.I.S.C.O:</strong>

                    <span>
                        Systems online.
                        How may I assist you, Boss?
                    </span>

                </div>

            </div>

        </section>


        <!-- ================= INPUT ================= -->

        <section class="command-area">

            <div class="input-wrapper">

                <input
                    id="msg"
                    type="text"
                    placeholder="Ask D.I.S.C.O..."
                    autocomplete="off"
                >

                <button
                    id="mic"
                    type="button"
                    title="Voice input"
                >
                    🎙
                </button>

            </div>


            <button
                id="send"
                class="send-btn"
                type="button"
            >
                SEND
            </button>

        </section>


        <!-- ================= EXTRA CONTROLS ================= -->

        <section class="extra-controls">

            <button
                id="clearBtn"
                type="button"
            >
                CLEAR MEMORY
            </button>

            <button
                id="keyBtn"
                type="button"
            >
                API KEY
            </button>

            <label class="vision-btn">

                VISION

                <input
                    id="imgInput"
                    type="file"
                    accept="image/*"
                >

            </label>

        </section>


        <!-- ================= FOOTER ================= -->

        <footer>

            <div class="footer-decoration">

                <span></span>
                <span></span>
                <span></span>

            </div>

            <div class="footer-dots">
                • • • • • •
            </div>

            <div class="footer-text">
                D.I.S.C.O SYSTEMS v1.0
            </div>

            <div class="footer-dots">
                • • •
            </div>

        </footer>

    </main>


    <!-- YOUR EXISTING JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
