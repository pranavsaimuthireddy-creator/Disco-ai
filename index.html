<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D.I.S.C.O. Mobile AI Core</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="top">

        <div>
            <div class="brand">D.I.S.C.O</div>
            <div class="subtitle">MOBILE AI CORE</div>
        </div>

        <div class="system-online">
            <span class="online-dot"></span>
            SYSTEM ONLINE
        </div>

    </header>


    <!-- CORE -->
    <section class="core-area">

        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>
        <div class="orbit orbit-three"></div>

        <div class="core">

            <img
                id="coreImage"
                src="core.png"
                alt="D.I.S.C.O. AI Core"
            >

        </div>

        <div id="stateText" class="state-text">
            ◈ READY
        </div>

    </section>


    <!-- STATUS -->
    <section class="status-grid">

        <div class="status-card">
            <div class="icon">◈</div>
            <div>
                <b>MEMORY</b>
                <small id="memoryStatus">ONLINE</small>
            </div>
        </div>

        <div class="status-card">
            <div class="icon">◉</div>
            <div>
                <b>VOICE</b>
                <small id="voiceStatus">READY</small>
            </div>
        </div>

        <div class="status-card">
            <div class="icon">◇</div>
            <div>
                <b>VISION</b>
                <small>READY</small>
            </div>
        </div>

        <div class="status-card">
            <div class="icon">⌁</div>
            <div>
                <b>NETWORK</b>
                <small id="networkStatus">ONLINE</small>
            </div>
        </div>

        <div class="status-card">
            <div class="icon">✦</div>
            <div>
                <b>AI CORE</b>
                <small>ACTIVE</small>
            </div>
        </div>

        <div class="status-card">
            <div class="icon">▣</div>
            <div>
                <b>SYSTEM</b>
                <small>SYSTEM READY</small>
            </div>
        </div>

    </section>


    <!-- COMMUNICATION -->
    <section class="communication">

        <div class="communication-title">
            D.I.S.C.O / COMMUNICATION
        </div>

        <div id="chat" class="chat">

            <div class="message ai-message">
                Systems online. How may I assist you, Boss?
            </div>

        </div>

    </section>


    <!-- CONTROLS -->
    <section class="controls">

        <div class="input-row">

            <input
                id="msg"
                type="text"
                placeholder="Talk to D.I.S.C.O..."
                autocomplete="off"
            >

            <button id="mic" class="mic-button">
                🎤
            </button>

            <button id="send" class="send-button">
                SEND
            </button>

        </div>


        <div class="button-row">

            <button id="clearBtn">
                CLEAR MEMORY
            </button>

            <button id="keyBtn">
                API KEY
            </button>

            <label class="vision-button">
                🖼 VISION

                <input
                    id="imgInput"
                    type="file"
                    accept="image/*"
                    hidden
                >
            </label>

        </div>

    </section>


    <footer>
        D.I.S.C.O. MOBILE AI CORE
    </footer>

</div>


<script src="script.js"></script>

</body>
</html>
