<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>D.I.S.C.O - Mobile AI Core</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <h1>D.I.S.C.O</h1>

        <p>MOBILE AI CORE</p>

        <div class="system-status">
            SYSTEM ONLINE
        </div>

    </header>


    <!-- DISCO CORE -->

    <section class="core-area">

        <div class="disco-core">

            <div class="orbit orbit1"></div>
            <div class="orbit orbit2"></div>
            <div class="orbit orbit3"></div>

            <div class="ball">

                <div class="ball-surface"></div>

                <div class="ball-highlight"></div>

                <div class="ball-light"></div>

                <div class="ball-letter">
                    D
                </div>

            </div>

        </div>

    </section>


    <!-- STATE -->

    <div id="state">

        <span id="stateDot"></span>

        <span id="stateText">
            READY
        </span>

    </div>


    <div id="activity">
        SYSTEM READY
    </div>


    <!-- SYSTEM BOXES -->

    <section class="status-grid">

        <div class="status-card memory">

            <strong>MEMORY</strong>

            <span>ONLINE</span>

        </div>


        <div class="status-card voice">

            <strong>VOICE</strong>

            <span>READY</span>

        </div>


        <div class="status-card vision">

            <strong>VISION</strong>

            <span>READY</span>

        </div>


        <div class="status-card network">

            <strong>NETWORK</strong>

            <span id="networkStatus">
                ONLINE
            </span>

        </div>


        <div class="status-card core">

            <strong>AI CORE</strong>

            <span>ACTIVE</span>

        </div>


        <div class="status-card system">

            <strong>SYSTEM</strong>

            <span>ONLINE</span>

        </div>

    </section>


    <!-- COMMUNICATION -->

    <section class="communication">

        <h2>
            D.I.S.C.O / COMMUNICATION
        </h2>


        <!-- CHAT -->

        <div id="chat">

            <div class="message ai">
                Systems online. How may I assist you, Boss?
            </div>

        </div>


        <!-- INPUT -->

        <div class="controls">

            <input
                type="text"
                id="msg"
                placeholder="Ask D.I.S.C.O..."
                autocomplete="off"
            >

            <button id="mic">
                🎙
            </button>

            <button id="send">
                SEND
            </button>

        </div>


        <!-- EXTRA CONTROLS -->

        <div class="extra-controls">

            <button id="clear-btn">
                CLEAR MEMORY
            </button>

            <button id="key-btn">
                API KEY
            </button>

            <label class="image-button">

                IMAGE

                <input
                    type="file"
                    id="img-input"
                    accept="image/*"
                >

            </label>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        D.I.S.C.O MOBILE AI CORE

    </footer>

</div>


<script src="script.js"></script>

</body>

</html>
