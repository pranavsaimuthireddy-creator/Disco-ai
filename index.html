<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D.I.S.C.O</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-grid"></div>
    <div class="scan-line"></div>

    <!-- HEADER -->
    <header>

        <div class="logo">
            D.I.S.C.O
        </div>

        <div class="subtitle">
            MOBILE AI CORE
        </div>

        <div class="online">
            <span></span>
            SYSTEM ONLINE
        </div>

    </header>


    <!-- MAIN CORE -->
    <main>

        <section class="core-area">

            <div class="core-label">
                D.I.S.C.O
            </div>

            <div
                id="discoCore"
                class="disco-core"
            >

                <div class="orbit orbit1"></div>
                <div class="orbit orbit2"></div>
                <div class="orbit orbit3"></div>

                <div class="ball">

                    <div class="ball-surface"></div>

                    <div class="ball-highlight"></div>

                    <div class="ball-light"></div>

                    <div class="ball-letter">
                        D
                    </div>

                </div>

            </div>


            <div
                id="state"
                class="state"
            >
                <span id="stateDot"></span>
                <span id="stateText">READY</span>
            </div>


            <div
                id="activity"
                class="activity"
            >
                SYSTEM READY
            </div>

        </section>


        <!-- STATUS -->
        <div class="status-grid">

    <div class="status-card memory">
        <strong>MEMORY</strong>
        <span>ONLINE</span>
    </div>

    <div class="status-card voice">
        <strong>VOICE</strong>
        <span>READY</span>
    </div>

    <div class="status-card vision">
        <strong>VISION</strong>
        <span>READY</span>
    </div>

    <div class="status-card network">
        <strong>NETWORK</strong>
        <span>ONLINE</span>
    </div>

    <div class="status-card core">
        <strong>AI CORE</strong>
        <span>ACTIVE</span>
    </div>

    <div class="status-card system">
        <strong>SYSTEM</strong>
        <span>ONLINE</span>
    </div>

        </div>


        <!-- CHAT -->
        <section class="communication">

            <div class="section-title">
                D.I.S.C.O / COMMUNICATION
            </div>

            <div
                id="chat"
                class="chat"
            >

                <div class="welcome">

                    <div class="mini-core">
                        D
                    </div>

                    <div>
                        <strong>D.I.S.C.O</strong>

                        <p>
                            Systems online.
                            How may I assist you, Boss?
                        </p>
                    </div>

                </div>

            </div>

        </section>


        <!-- CONTROLS -->
        <section class="controls">

            <div class="input-row">

                <input
                    id="msg"
                    type="text"
                    placeholder="Talk to D.I.S.C.O..."
                    autocomplete="off"
                >

                <button id="send">
                    SEND
                </button>

            </div>


            <div class="control-row">

                <button
                    id="mic"
                    class="tool"
                    type="button"
                >
                    🎙
                </button>

                <button
                    id="clear-btn"
                    class="tool"
                    type="button"
                >
                    ♻
                </button>

                <button
                    id="key-btn"
                    class="tool"
                    type="button"
                >
                    🔑
                </button>

                <label
                    for="img-input"
                    class="tool"
                >
                    🖼
                </label>

                <input
                    id="img-input"
                    type="file"
                    accept="image/*"
                    hidden
                >

            </div>

        </section>

    </main>


    <footer>
        D.I.S.C.O • ALWAYS WITH YOU
    </footer>


    <script src="script.js"></script>

</body>
</html>
