
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#020b10">
    <meta name="description" content="D.I.S.C.O Mobile AI Core">

    <title>D.I.S.C.O - MOBILE EDITION</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- BACKGROUND EFFECTS -->
    <div class="stars"></div>
    <div class="scanlines"></div>


    <!-- HEADER -->
    <header class="top-header">

        <button
            class="menu-btn"
            id="menuBtn"
            type="button"
            aria-label="Open menu"
        >
            ☰
        </button>

        <div class="header-logo">
            D.I.S.C.O
        </div>

        <div class="edition">
            <span>▯</span>
            MOBILE EDITION
        </div>

    </header>


    <main>

        <!-- HERO SECTION -->
        <section class="hero">

            <div class="hero-content">

                <div class="main-logo">
                    D.I.S.C.O
                </div>

                <div class="mobile-edition">
                    MOBILE EDITION
                </div>

                <div class="core-active">
                    <span>⌜</span>
                    CORE ACTIVE
                    <span>⌟</span>
                </div>

            </div>


            <!-- AI ENERGY BALL -->
            <!-- No external image required -->

            <div class="core-area" id="coreArea">

                <div class="core-ring ring1"></div>
                <div class="core-ring ring2"></div>
                <div class="core-ring ring3"></div>

                <div class="core-glow"></div>

                <div
                    id="coreImage"
                    role="img"
                    aria-label="D.I.S.C.O glowing AI energy core"
                >

                    <div class="orb-inner"></div>

                    <div class="orb-highlight"></div>

                    <div class="orb-particles"></div>

                </div>

            </div>

        </section>


        <!-- SYSTEM STATUS PANEL -->
        <section class="system-status">

            <div class="status-heading">

                <span class="heading-icon">▣</span>

                <span>SYSTEM STATUS</span>

            </div>


            <!-- AI CORE -->
            <div class="status-row">

                <div class="status-label">

                    <span class="status-icon cyan">▣</span>

                    <span>AI CORE</span>

                </div>

                <div class="status-online">

                    <span class="green-dot"></span>

                    ONLINE

                </div>

            </div>


            <!-- NETWORK -->
            <div class="status-row">

                <div class="status-label">

                    <span class="status-icon cyan">⌁</span>

                    <span>NETWORK</span>

                </div>

                <div
                    class="status-online"
                    id="networkStatus"
                >

                    <span class="green-dot"></span>

                    ONLINE

                </div>

            </div>


            <!-- VOICE -->
            <div class="status-row">

                <div class="status-label">

                    <span class="status-icon red">♩</span>

                    <span>VOICE</span>

                </div>

                <div
                    class="status-locked"
                    id="voiceStatus"
                >

                    <span>▣</span>

                    LOCKED

                </div>

            </div>


            <!-- MEMORY -->
            <div class="status-row">

                <div class="status-label">

                    <span class="status-icon red">▣</span>

                    <span>MEMORY</span>

                </div>

                <div
                    class="status-locked"
                    id="memoryStatus"
                >

                    <span>▣</span>

                    LOCKED

                </div>

            </div>


            <!-- USER STATUS -->
            <div class="status-row">

                <div class="status-label">

                    <span class="status-icon cyan">♙</span>

                    <span>YOU</span>

                </div>

                <div
                    class="you-status"
                    id="userStatus"
                >
                    Hi
                </div>

            </div>

        </section>


        <!-- CHAT PANEL -->
        <section class="chat-panel">

            <div
                id="chat"
                class="chat-box"
                role="log"
                aria-live="polite"
                aria-label="D.I.S.C.O conversation"
            >

                <div class="message ai-message">

                    <strong>D.I.S.C.O:</strong>

                    <span>
                        Systems online. How may I assist you, Boss?
                    </span>

                </div>

            </div>

        </section>


        <!-- COMMAND INPUT -->
        <section class="command-area">

            <div class="input-box">

                <input
                    id="msg"
                    name="message"
                    type="text"
                    placeholder="Ask D.I.S.C.O..."
                    autocomplete="off"
                    aria-label="Enter a message"
                >

                <button
                    id="mic"
                    type="button"
                    aria-label="Start voice input"
                    title="Voice input"
                >
                    🎙
                </button>

            </div>


            <button
                id="send"
                class="send-button"
                type="button"
            >
                SEND
            </button>

        </section>


        <!-- ADDITIONAL CONTROLS -->
        <section class="extra-controls">

            <button
                id="clearBtn"
                type="button"
            >
                CLEAR MEMORY
            </button>

            <button
                id="keyBtn"
                type="button"
            >
                API KEY
            </button>

            <label
                class="vision-button"
                for="imgInput"
            >
                VISION

                <input
                    id="imgInput"
                    type="file"
                    accept="image/*"
                    aria-label="Choose an image"
                >
            </label>

        </section>


        <!-- FOOTER -->
        <footer>

            <div class="footer-bars">

                <span></span>
                <span></span>
                <span></span>

            </div>

            <div class="footer-dots">
                • • • • •
            </div>

            <div class="footer-title">
                D.I.S.C.O SYSTEMS v1.0
            </div>

            <div class="footer-dots">
                • • •
            </div>

        </footer>

    </main>


    <!-- EXISTING JAVASCRIPT -->
    <script src="./script.js"></script>

</body>

</html>
