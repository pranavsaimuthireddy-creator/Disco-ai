<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>D.I.S.C.O. MOBILE AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header>
        <div class="brand">D.I.S.C.O</div>
        <div class="subtitle">MOBILE AI CORE</div>
        <div class="online-title">SYSTEM ONLINE</div>
    </header>


    <!-- CORE -->
    <section class="core-section">

        <div class="core-label left-label">
            D.I.S.C.O
        </div>

        <div class="core-label right-label">
            D.I.S.C.O.
        </div>


        <div class="disco-core">

            <div class="orbit orbit-a"></div>
            <div class="orbit orbit-b"></div>
            <div class="orbit orbit-c"></div>

            <div class="ball">

                <div class="ball-grid"></div>

                <div class="ball-shine"></div>

                <div class="ball-letter">
                    D
                </div>

            </div>

        </div>


        <div id="state">
            <span id="stateDot"></span>
            <span id="stateText">READY</span>
        </div>

        <div id="activity">
            SYSTEM READY
        </div>

    </section>


    <!-- STATUS BOXES -->
    <section class="status-grid">

        <div class="status-card memory-card">
            <div class="card-icon">◈</div>
            <h3>MEMORY</h3>
            <span id="memoryStatus">ONLINE</span>
        </div>

        <div class="status-card voice-card">
            <div class="card-icon">◉</div>
            <h3>VOICE</h3>
            <span id="voiceStatus">READY</span>
        </div>

        <div class="status-card vision-card">
            <div class="card-icon">◇</div>
            <h3>VISION</h3>
            <span id="visionStatus">READY</span>
        </div>

        <div class="status-card network-card">
            <div class="card-icon">⌁</div>
            <h3>NETWORK</h3>
            <span id="networkStatus">ONLINE</span>
        </div>

        <div class="status-card core-card">
            <div class="card-icon">✦</div>
            <h3>AI CORE</h3>
            <span>ACTIVE</span>
        </div>

        <div class="status-card system-card">
            <div class="card-icon">▣</div>
            <h3>SYSTEM</h3>
            <span>ONLINE</span>
        </div>

    </section>


    <!-- CHAT TITLE -->
    <section class="communication-title">
        D.I.S.C.O / COMMUNICATION
    </section>


    <!-- CHAT -->
    <section id="chat">

        <div class="message ai">
            Systems online. How may I assist you, Boss?
        </div>

    </section>


    <!-- INPUT -->
    <section class="controls">

        <input
            id="msg"
            type="text"
            placeholder="Talk to D.I.S.C.O..."
            autocomplete="off"
        >

        <button id="mic" type="button">
            🎤
        </button>

        <button id="send" type="button">
            SEND
        </button>

    </section>


    <!-- EXTRA BUTTONS -->
    <section class="extra-controls">

        <button id="clear-btn" type="button">
            CLEAR MEMORY
        </button>

        <button id="key-btn" type="button">
            API KEY
        </button>

        <label class="image-button">
            🖼️ VISION
            <input
                id="img-input"
                type="file"
                accept="image/*"
            >
        </label>

    </section>


    <footer>
        D.I.S.C.O. MOBILE AI CORE
    </footer>

</div>


<script src="script.js"></script>

</body>
</html>
