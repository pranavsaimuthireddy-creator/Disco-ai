<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>D.I.S.C.O — Mobile AI</title>

    <link rel="stylesheet" href="style.css?v=5000">
</head>

<body>

    <!-- BACKGROUND HUD -->

    <div class="hud-grid"></div>

    <div class="scan-line"></div>


    <!-- HEADER -->

    <header class="header">

        <div class="brand">
            D.I.S.C.O
        </div>

        <div class="subtitle">
            MOBILE AI CORE
        </div>

    </header>


    <!-- REACTOR -->

    <section class="reactor-section">

        <div class="reactor">

            <div class="reactor-ring ring-one"></div>

            <div class="reactor-ring ring-two"></div>

            <div class="reactor-ring ring-three"></div>

            <div class="reactor-core">

                <span>AI</span>

            </div>

        </div>

        <div class="reactor-status">
            <span class="status-dot"></span>
            D.I.S.C.O ONLINE
        </div>

    </section>


    <!-- STATUS -->

    <section class="status-panel">

        <div class="section-title">
            SYSTEM STATUS
        </div>

        <div class="status-grid">

            <div class="status-card">
                <div class="status-icon">◈</div>
                <div class="status-name">AI CORE</div>
                <div class="status-value">
                    <span></span> ONLINE
                </div>
            </div>

            <div class="status-card">
                <div class="status-icon">⚡</div>
                <div class="status-name">NETWORK</div>
                <div class="status-value">
                    <span></span> ONLINE
                </div>
            </div>

            <div class="status-card">
                <div class="status-icon">◉</div>
                <div class="status-name">VOICE</div>
                <div class="status-value">
                    <span></span> READY
                </div>
            </div>

            <div class="status-card">
                <div class="status-icon">◎</div>
                <div class="status-name">MEMORY</div>
                <div class="status-value">
                    <span></span> ACTIVE
                </div>
            </div>

        </div>

    </section>


    <!-- CHAT -->

    <section class="chat-panel">

        <div class="chat-header">

            <span class="led"></span>
            <span class="led"></span>
            <span class="led"></span>

            <span class="chat-title">
                D.I.S.C.O / COMMUNICATION
            </span>

        </div>


        <div
            id="chat"
            class="chat"
        >

            <div class="intro-message">

                <strong>D.I.S.C.O: Systems online.</strong>

                <span>Your personal AI assistant.</span>

            </div>

        </div>

    </section>


    <!-- INPUT -->

    <section class="control-panel">

        <input
            id="msg"
            type="text"
            placeholder="Talk to D.I.S.C.O..."
            autocomplete="off"
        >

        <div class="buttons">

            <button
                id="send"
                class="send-btn"
            >
                SEND
            </button>

            <button
                id="mic-btn"
                class="icon-btn"
                title="Voice input"
            >
                🎙️
            </button>

            <button
                id="clear-btn"
                class="icon-btn"
                title="Clear memory"
            >
                🗑️
            </button>

            <button
                id="key-btn"
                class="icon-btn"
                title="Change Gemini API key"
            >
                🔑
            </button>

            <button
                id="img-btn"
                class="icon-btn"
                title="Analyse image"
            >
                🖼️
            </button>

        </div>

        <input
            id="img-input"
            type="file"
            accept="image/*"
            hidden
        >

    </section>


    <!-- FOOTER -->

    <footer>

        <span>«</span>

        <strong>
            D.I.S.C.O • ALWAYS WITH YOU
        </strong>

        <span>»</span>

    </footer>


    <script src="script.js?v=5000"></script>

</body>
    </html>
