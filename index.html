<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.I.S.C.O - Mobile AI Core</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scanlines"></div>

<header class="top-bar">
    <div>
        <h1>D.I.S.C.O</h1>
        <span>MOBILE AI CORE</span>
    </div>

    <div class="system-status">
        <span class="status-dot"></span>
        SYSTEM ONLINE
    </div>
</header>

<main>

    <!-- CORE -->
    <section class="core-section">

        <div class="hud-ring ring-one"></div>
        <div class="hud-ring ring-two"></div>
        <div class="hud-ring ring-three"></div>

        <div class="core-container">
            <img id="coreImage" src="core.png" alt="D.I.S.C.O Core">

            <div class="core-label">
                <span id="stateText">SYSTEM READY</span>
            </div>
        </div>

        <div class="core-lines">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </section>


    <!-- SYSTEM PANELS -->
    <section class="system-grid">

        <div class="system-card">
            <div class="card-icon">◈</div>
            <div>
                <b>MEMORY</b>
                <small id="memoryStatus">ONLINE</small>
            </div>
        </div>

        <div class="system-card">
            <div class="card-icon">◉</div>
            <div>
                <b>VOICE</b>
                <small id="voiceStatus">READY</small>
            </div>
        </div>

        <div class="system-card">
            <div class="card-icon">◇</div>
            <div>
                <b>VISION</b>
                <small>READY</small>
            </div>
        </div>

        <div class="system-card">
            <div class="card-icon">⌁</div>
            <div>
                <b>NETWORK</b>
                <small id="networkStatus">ONLINE</small>
            </div>
        </div>

        <div class="system-card">
            <div class="card-icon">✦</div>
            <div>
                <b>AI CORE</b>
                <small>ACTIVE</small>
            </div>
        </div>

        <div class="system-card">
            <div class="card-icon">▣</div>
            <div>
                <b>SYSTEM</b>
                <small>ONLINE</small>
            </div>
        </div>

    </section>


    <!-- COMMUNICATION -->
    <section class="communication">

        <div class="communication-title">
            <span></span>
            D.I.S.C.O / COMMUNICATION
            <span></span>
        </div>

        <div id="chat" class="chat-box">
            <div class="message ai">
                Systems online. How may I assist you, Boss?
            </div>
        </div>

        <div class="input-area">

            <input
                id="msg"
                type="text"
                placeholder="Communicate with D.I.S.C.O..."
                autocomplete="off"
            >

            <button id="mic" title="Voice input">🎙</button>

            <button id="send">SEND</button>

        </div>

        <div class="secondary-controls">

            <button id="clearBtn">CLEAR MEMORY</button>

            <button id="keyBtn">API KEY</button>

            <label class="image-button">
                VISION
                <input id="imgInput" type="file" accept="image/*">
            </label>

        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
