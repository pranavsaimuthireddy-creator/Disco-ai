<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>DISCO — AI CORE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="stars"></div>

  <main class="app">

    <!-- HEADER -->
    <header class="top">
      <div>
        <div class="brand">DISCO</div>
        <div class="subtitle">AI CORE • YEAR 3000</div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        ONLINE
      </div>
    </header>


    <!-- GLOBE -->
    <section class="globe-area">

      <div class="globe-ring ring-one"></div>
      <div class="globe-ring ring-two"></div>

      <div class="globe">
        <div class="latitude lat1"></div>
        <div class="latitude lat2"></div>
        <div class="latitude lat3"></div>
        <div class="longitude lon1"></div>
        <div class="longitude lon2"></div>
        <div class="longitude lon3"></div>
        <div class="globe-light"></div>
      </div>

      <div class="core-text">
        <strong>CORE</strong>
        <span>ACTIVE</span>
      </div>

    </section>


    <!-- LIVE INFORMATION -->
    <section class="info-panel">

      <div class="info-box">
        <small>TIME</small>
        <strong id="clock">--:--:--</strong>
      </div>

      <div class="info-box">
        <small>DATE</small>
        <strong id="date">--/--/----</strong>
      </div>

    </section>


    <!-- CHAT -->
    <section class="chat-box" id="chat">

      <div class="message disco-message">
        <div class="message-name">DISCO</div>
        <div>
          Systems online, Boss. How may I assist you?
        </div>
      </div>

    </section>


    <!-- INPUT -->
    <section class="input-area">

      <input
        id="msg"
        type="text"
        autocomplete="off"
        placeholder="Talk to DISCO..."
      >

      <button id="mic" class="round-btn" title="Microphone">
        🎤
      </button>

      <button id="send" class="send-btn">
        SEND
      </button>

    </section>


    <!-- CONTROLS -->
    <section class="controls">

      <button id="cameraBtn" class="control-btn">
        📷
        <span>CAMERA</span>
      </button>

      <button id="memoryBtn" class="control-btn">
        🧠
        <span>MEMORY</span>
      </button>

      <button id="playMemoryBtn" class="control-btn">
        🔊
        <span>PLAY</span>
      </button>

      <button id="keyBtn" class="control-btn">
        🔑
        <span>API KEY</span>
      </button>

    </section>


    <div class="footer">
      DISCO AI CORE
    </div>

  </main>


  <!-- API KEY MODAL -->
  <div id="keyModal" class="modal hidden">

    <div class="modal-card">

      <h2>GEMINI API KEY</h2>

      <p>
        Enter your Gemini API key. It will be saved only in this browser.
      </p>

      <input
        id="apiKeyInput"
        type="password"
        placeholder="Paste API key here"
      >

      <div class="modal-buttons">

        <button id="saveKeyBtn">
          SAVE
        </button>

        <button id="closeKeyBtn">
          CLOSE
        </button>

      </div>

    </div>

  </div>


  <!-- CAMERA -->
  <input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
    hidden
  >


  <script src="script.js"></script>

</body>
  </html>
