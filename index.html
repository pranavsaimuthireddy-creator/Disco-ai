<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>D.I.S.C.O AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-grid"></div>

    <header>
        <div class="top-bar">
            <span class="menu">☰</span>
            <span class="online">
                ● SYSTEM ONLINE
            </span>
            <span>◉</span>
        </div>

        <h1>D.I.S.C.O</h1>
        <p>MOBILE AI SYSTEM</p>
    </header>


    <!-- CORE -->

    <section class="core-section">

        <div class="core">

            <div class="ring ring1"></div>
            <div class="ring ring2"></div>
            <div class="ring ring3"></div>

            <div class="core-text">
                <strong>D.I.S.C.O</strong>
                <span>CORE ACTIVE</span>
                <i></i>
            </div>

        </div>

    </section>


    <!-- STATUS -->

    <section class="panel">

        <div class="panel-title">
            ⚡ SYSTEM STATUS
        </div>

        <div class="status-grid">

            <div class="status-card">
                <div class="icon">▣</div>
                <h3>AI CORE</h3>
                <span>● ONLINE</span>
            </div>

            <div class="status-card">
                <div class="icon">⌁</div>
                <h3>NETWORK</h3>
                <span>● ONLINE</span>
            </div>

            <div class="status-card">
                <div class="icon">♬</div>
                <h3>VOICE</h3>
                <span>● READY</span>
            </div>

            <div class="status-card">
                <div class="icon">🧠</div>
                <h3>MEMORY</h3>
                <span>● ONLINE</span>
            </div>

        </div>

    </section>


    <!-- CHAT -->

    <section class="chat-panel">

        <div class="terminal">

            <div class="terminal-top">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div id="chat" class="chat">

                <div class="msg ai">
                    D.I.S.C.O: Systems online.
                    <br>
                    How may I assist you, Boss?
                </div>

            </div>

        </div>

    </section>


    <!-- INPUT -->

    <section class="input-section">

        <div class="input-box">

            <input
                id="msg"
                type="text"
                placeholder="Ask D.I.S.C.O..."
                autocomplete="off"
            >

            <div class="buttons">

                <button id="send" type="button">
                    SEND
                </button>

                <button id="mic" type="button">
                    🎙️
                </button>

                <button id="clear-btn" type="button">
                    🗑️
                </button>

                <button id="change-key" type="button">
                    🔑
                </button>

                <button id="img-btn" type="button">
                    🖼️
                </button>

                <input
                    id="img-input"
                    type="file"
                    accept="image/*"
                    hidden
                >

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>
        <span>‹‹</span>
        <strong>D.I.S.C.O : ALWAYS WITH YOU</strong>
        <span>››</span>
    </footer>


    <!-- IMPORTANT: CACHE BUSTER -->

    <script src="script.js?v=2001"></script>

</body>
</html>
